<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Assistant · Movie Orbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne+Mono&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Base ─────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --teal:      #38e0b8;
            --blue:      #57b3ff;
            --bg:        #060910;
            --surface:   rgba(255,255,255,0.035);
            --border:    rgba(56,224,184,0.15);
            --border-b:  rgba(87,179,255,0.14);
            --text:      #c8deff;
            --text-dim:  rgba(140,170,220,0.5);
            --user-bg:   rgba(56,224,184,0.13);
            --user-border: rgba(56,224,184,0.3);
            --bot-bg:    rgba(87,179,255,0.07);
            --bot-border: rgba(87,179,255,0.18);
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        /* ── Starfield canvas ─────────────────────────────────── */
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Ambient glow orbs ────────────────────────────────── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(56,224,184,0.08) 0%, transparent 70%);
            top: -120px; left: -80px;
            animation: orbDrift1 18s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, rgba(87,179,255,0.07) 0%, transparent 70%);
            bottom: -100px; right: -100px;
            animation: orbDrift2 22s ease-in-out infinite alternate;
        }
        @keyframes orbDrift1 {
            from { transform: translate(0,0); }
            to   { transform: translate(60px, 40px); }
        }
        @keyframes orbDrift2 {
            from { transform: translate(0,0); }
            to   { transform: translate(-50px, -60px); }
        }

        /* ── Layout ───────────────────────────────────────────── */
        .page {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ── Header ───────────────────────────────────────────── */
        header {
            padding: 22px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            animation: fadeDown 0.5s ease both;
        }
        @keyframes fadeDown {
            from { opacity:0; transform: translateY(-12px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: 1px solid rgba(87,179,255,0.18);
            border-radius: 7px;
            padding: 6px 12px;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .back-btn:hover {
            color: var(--blue);
            border-color: rgba(87,179,255,0.42);
            background: rgba(87,179,255,0.06);
        }
        .back-btn svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 10px var(--teal);
            animation: blink 2.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,100% { opacity:1; }
            50%      { opacity:0.3; }
        }
        .title-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--teal);
        }
        .title-sub {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .clear-btn {
            background: none;
            border: 1px solid rgba(255,100,100,0.2);
            border-radius: 7px;
            color: rgba(255,140,140,0.5);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 6px 12px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .clear-btn:hover {
            color: rgba(255,120,120,0.9);
            border-color: rgba(255,100,100,0.45);
            background: rgba(255,60,60,0.06);
        }

        /* ── Messages area ────────────────────────────────────── */
        .messages {
            overflow-y: auto;
            padding: 28px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: thin;
            scrollbar-color: rgba(56,224,184,0.05) transparent;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(56,224,184,0.05); border-radius: 4px; }

        /* Date separator */
        .date-sep {
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'Syne Mono', monospace;
            letter-spacing: 0.08em;
            margin: 6px 0;
            animation: fadeIn 0.3s ease both;
        }

        /* Message bubbles */
        .msg-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            animation: msgSlide 0.25s ease both;
        }
        @keyframes msgSlide {
            from { opacity:0; transform: translateY(10px); }
            to   { opacity:1; transform: translateY(0); }
        }
        .msg-row.user { flex-direction: row-reverse; padding-right: 5px; }

        .msg-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }
        .msg-row.bot .msg-avatar {
            background: linear-gradient(135deg, rgba(56,224,184,0.2), rgba(87,179,255,0.2));
            border: 1px solid rgba(56,224,184,0.25);
            color: var(--teal);
            font-family: 'Syne Mono', monospace;
            font-size: 11px;
        }
        .msg-row.user .msg-avatar {
            background: linear-gradient(135deg, rgba(87,179,255,0.18), rgba(56,224,184,0.12));
            border: 1px solid rgba(87,179,255,0.25);
            color: var(--blue);
            font-family: 'Syne Mono', monospace;
            font-size: 11px;
        }

        .msg-bubble {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            word-break: break-word;
        }
        .msg-row.bot .msg-bubble {
            background: var(--bot-bg);
            border: 1px solid var(--bot-border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .msg-row.user .msg-bubble {
            background: var(--user-bg);
            border: 1px solid var(--user-border);
            color: #dcfff7;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'Syne Mono', monospace;
            margin-top: 5px;
            letter-spacing: 0.04em;
        }
        .msg-row.user .msg-time { text-align: right; }

        .msg-col { flex: 1; display: flex; flex-direction: column; }
        .msg-row.user .msg-col { align-items: flex-end; }

        /* Typing indicator */
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bot-bg);
            border: 1px solid var(--bot-border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }
        .typing-bubble span {
            display: inline-block;
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--blue);
            animation: typeDot 1.1s ease-in-out infinite;
        }
        .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
        .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes typeDot {
            0%,80%,100% { transform:scale(0.65); opacity:0.35; }
            40%         { transform:scale(1.1);  opacity:1; }
        }

        /* Suggested questions */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
            animation: fadeIn 0.4s 0.3s ease both;
        }
        @keyframes fadeIn {
            from { opacity:0; } to { opacity:1; }
        }
        .suggestion-chip {
            background: none;
            border: 1px solid rgba(87,179,255,0.24);
            border-radius: 20px;
            color: rgba(140,190,255,0.75);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .suggestion-chip:hover {
            background: rgba(87,179,255,0.1);
            color: var(--blue);
            border-color: rgba(87,179,255,0.5);
        }

        /* ── Input area ───────────────────────────────────────── */
        footer {
            padding: 16px 0 24px;
            border-top: 1px solid var(--border);
            animation: fadeUp 0.5s 0.15s ease both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(12px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(87,179,255,0.2);
            border-radius: 14px;
            padding: 10px 12px 10px 16px;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: rgba(56,224,184,0.4);
            box-shadow: 0 0 0 3px rgba(56,224,184,0.06);
        }

        #chat-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #e0eeff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            padding-bottom: 8px;
            min-height: 22px;
            max-height: 120px;
            scrollbar-width: none;
        }
        #chat-input::placeholder { color: var(--text-dim); }
        #chat-input::-webkit-scrollbar { display: none; }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .char-count {
            font-family: 'Syne Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
            min-width: 34px;
            text-align: right;
        }
        .char-count.warn { color: rgba(255,180,80,0.7); }

        .send-btn {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--teal), var(--blue));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 0 14px rgba(56,224,184,0.25);
        }
        .send-btn:hover:not(:disabled) {
            opacity: 0.88;
            transform: scale(1.06);
            box-shadow: 0 0 22px rgba(56,224,184,0.4);
        }
        .send-btn:disabled { opacity: 0.28; cursor: default; transform: none; box-shadow: none; }
        .send-btn svg { width: 17px; height: 17px; fill: #060910; }

        .hint-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 2px;
        }
        .hint {
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'Syne Mono', monospace;
            letter-spacing: 0.04em;
        }
        .hint kbd {
            display: inline-block;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'Syne Mono', monospace;
            font-size: 10px;
        }
    </style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="page">

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="/" class="back-btn">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Orbit
            </a>
            <div class="header-title">
                <div class="status-dot"></div>
                <div>
                    <div class="title-text">Movie Assistant</div>
                    <div class="title-sub">AI · powered by your collection</div>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button class="clear-btn" id="clear-btn">Clear</button>
        </div>
    </header>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="date-sep">Today</div>

        <!-- Welcome message -->
        <div class="msg-row bot">
            <div class="msg-avatar">AI</div>
            <div class="msg-col">
                <div class="msg-bubble">
                    Hello! I'm your Movie Assistant. I can help you discover films, explore genres, compare movies, find hidden gems, and much more. What are you in the mood for?
                </div>
                <div class="msg-time" id="welcome-time"></div>
                <div class="suggestions" id="suggestions">
                    <button class="suggestion-chip">🎬 Best sci-fi of the 2010s</button>
                    <button class="suggestion-chip">🏆 Award-winning dramas</button>
                    <button class="suggestion-chip">😂 Hidden comedy gems</button>
                    <button class="suggestion-chip">🔍 Movies like Interstellar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Input -->
    <footer>
        <div class="input-wrapper">
            <textarea
                id="chat-input"
                placeholder="Ask me anything about movies…"
                rows="1"
                maxlength="800"
                autocomplete="off"
            ></textarea>
            <div class="input-actions">
                <span class="char-count" id="char-count">800</span>
                <button class="send-btn" id="send-btn" disabled>
                    <svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
        <div class="hint-row">
            <span class="hint"><kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line</span>
            <span class="hint" id="msg-count">0 messages</span>
        </div>
    </footer>

</div>

<script>
/* ── Starfield ────────────────────────────────────────────── */
(function () {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = Array.from({ length: 200 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            s: Math.random() * 1.6 + 0.2,
            a: Math.random() * 0.7 + 0.1,
            speed: Math.random() * 0.015 + 0.003,
            phase: Math.random() * Math.PI * 2,
        }));
    }

    function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const star of stars) {
            const alpha = star.a * (0.6 + 0.4 * Math.sin(t * star.speed + star.phase));
            ctx.fillStyle = `rgba(200,220,255,${alpha})`;
            ctx.fillRect(star.x, star.y, star.s, star.s);
        }
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
})();

/* ── Chat logic ───────────────────────────────────────────── */
(function () {
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('chat-input');
    const sendBtn    = document.getElementById('send-btn');
    const charCount  = document.getElementById('char-count');
    const msgCountEl = document.getElementById('msg-count');
    const clearBtn   = document.getElementById('clear-btn');
    const suggestionsEl = document.getElementById('suggestions');

    let msgCount = 0;

    /* Set welcome timestamp */
    document.getElementById('welcome-time').textContent = formatTime(new Date());

    function formatTime(d) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    /* Auto-resize textarea */
    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
        const remaining = 800 - inputEl.value.length;
        charCount.textContent = remaining;
        charCount.classList.toggle('warn', remaining < 80);
        sendBtn.disabled = !inputEl.value.trim();
    });

    /* Suggestion chips */
    suggestionsEl.addEventListener('click', (e) => {
        const chip = e.target.closest('.suggestion-chip');
        if (!chip) return;
        inputEl.value = chip.textContent.replace(/^[^\w]+/, '').trim();
        inputEl.dispatchEvent(new Event('input'));
        suggestionsEl.remove();
        sendMessage();
    });

    /* Keyboard shortcuts */
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!sendBtn.disabled) sendMessage();
        }
    });
    sendBtn.addEventListener('click', sendMessage);

    /* Clear */
    clearBtn.addEventListener('click', () => {
        messagesEl.innerHTML = '';
        msgCount = 0;
        updateMsgCount();
        appendDateSep('Cleared');
        appendBotMsg('History cleared. Ask me anything about movies!');
    });

    function updateMsgCount() {
        msgCountEl.textContent = msgCount === 0
            ? '0 messages'
            : `${msgCount} message${msgCount !== 1 ? 's' : ''}`;
    }

    function appendDateSep(label) {
        const div = document.createElement('div');
        div.className = 'date-sep';
        div.textContent = label;
        messagesEl.appendChild(div);
    }

    function appendUserMsg(text) {
        const now = new Date();
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `
            <div class="msg-avatar">You</div>
            <div class="msg-col">
                <div class="msg-bubble">${escHtml(text)}</div>
                <div class="msg-time">${formatTime(now)}</div>
            </div>`;
        messagesEl.appendChild(row);
        scroll();
        msgCount++;
        updateMsgCount();
    }

    function appendBotMsg(text) {
        const now = new Date();
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.innerHTML = `
            <div class="msg-avatar">AI</div>
            <div class="msg-col">
                <div class="msg-bubble">${escHtml(text)}</div>
                <div class="msg-time">${formatTime(now)}</div>
            </div>`;
        messagesEl.appendChild(row);
        scroll();
        msgCount++;
        updateMsgCount();
    }

    function showTyping() {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.id = 'typing-row';
        row.innerHTML = `
            <div class="msg-avatar">AI</div>
            <div class="typing-bubble">
                <span></span><span></span><span></span>
            </div>`;
        messagesEl.appendChild(row);
        scroll();
        return row;
    }

    function scroll() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/\n/g, '<br>');
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        /* Reset input */
        inputEl.value = '';
        inputEl.style.height = 'auto';
        charCount.textContent = '800';
        charCount.classList.remove('warn');
        sendBtn.disabled = true;

        appendUserMsg(text);
        const typingRow = showTyping();

        try {
            const res  = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text }),
            });
            const data = await res.json();
            typingRow.remove();
            appendBotMsg(data.reply || 'No response received.');
        } catch (_err) {
            typingRow.remove();
            appendBotMsg('⚠ Could not reach the server. Please check your connection.');
        }
    }
})();
</script>

</body>
</html>
