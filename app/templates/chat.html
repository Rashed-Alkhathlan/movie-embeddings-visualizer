<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Movie Assistant · Movie Orbit</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne+Mono&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/chat-view/style.css') }}">
    </head>
    <body>
        <canvas id="stars"></canvas>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="page">

            <!-- Header -->
            <header>
                <div class="header-left">
                    <a href="/" class="back-btn">
                        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        Orbit
                    </a>
                    <div class="header-title">
                        <div class="status-dot"></div>
                        <div>
                            <div class="title-text">Movie Assistant</div>
                            <div class="title-sub">AI · powered by your collection</div>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <button class="clear-btn" id="clear-btn">Clear</button>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages" id="messages">
                <div class="date-sep">Today</div>

                <!-- Welcome message -->
                <div class="msg-row bot">
                    <div class="msg-avatar">AI</div>
                    <div class="msg-col">
                        <div class="msg-bubble">
                            Hello! I'm your Movie Assistant. I can help you discover films, explore genres, compare movies, find hidden gems, and much more. What are you in the mood for?
                        </div>
                        <div class="msg-time" id="welcome-time"></div>
                        <div class="suggestions" id="suggestions">
                            <button class="suggestion-chip">🎬 Best sci-fi of the 2010s</button>
                            <button class="suggestion-chip">🏆 Award-winning dramas</button>
                            <button class="suggestion-chip">😂 Hidden comedy gems</button>
                            <button class="suggestion-chip">🔍 Movies like Interstellar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input -->
            <footer>
                <div class="input-wrapper">
                    <textarea
                        id="chat-input"
                        placeholder="Ask me anything about movies…"
                        rows="1"
                        maxlength="800"
                        autocomplete="off"
                    ></textarea>
                    <div class="input-actions">
                        <span class="char-count" id="char-count">800</span>
                        <button class="send-btn" id="send-btn" disabled>
                            <svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="hint-row">
                    <span class="hint"><kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line</span>

                    <div style="display:flex; align-items:center; gap:12px;">
                        <span class="hint" id="msg-count">0 messages</span>

                        <div class="model-selector" id="model-selector">
                            <button class="model-btn" id="model-btn">
                                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 17.93V18a1 1 0 0 0-2 0v1.93A8 8 0 0 1 4.07 13H6a1 1 0 0 0 0-2H4.07A8 8 0 0 1 11 4.07V6a1 1 0 0 0 2 0V4.07A8 8 0 0 1 19.93 11H18a1 1 0 0 0 0 2h1.93A8 8 0 0 1 13 19.93z"/></svg>
                                <span id="model-label">Model</span>
                                <svg class="model-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                            </button>
                            <div class="model-dropdown" id="model-dropdown">
                                <div id="model-list">
                                    <div class="model-loading">Loading…</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </footer>
        </div>

        <script type="module" src="{{ url_for('static', filename='js/chat-view/main.js') }}"></script>
    </body>

</html>
